server:
  port: 8080
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
security:
  jwt:
    secret: ${JWT_SECRET:ByteVaultSuperSecretKeyForHmac256-ChangeMe-2026}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
