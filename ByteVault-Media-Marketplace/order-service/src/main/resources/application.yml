server:
  port: 8083
spring:
  application:
    name: ORDER-SERVICE
  datasource:
    url: jdbc:h2:file:./data/orderdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
security:
  jwt:
    secret: ${JWT_SECRET:ByteVaultSuperSecretKeyForHmac256-ChangeMe-2026}
  download:
    secret: ${DOWNLOAD_SECRET:ByteVaultDownloadSigningSecret-ChangeMe-2026}
app:
  gateway-base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
